# Optional local services. Start only the profile your machine needs.
# Default app mode uses SQLite and needs none of these containers.
services:
  postgres:
    image: postgres:16-alpine
    profiles: ["power"]
    environment:
      POSTGRES_USER: jinwoo
      POSTGRES_PASSWORD: change-me-locally
      POSTGRES_DB: jinwoo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["power"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana-oss:latest
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  redis-data:
