name: Build Android APK (OpenDroid + Toni)

# Builds an installable APK without you installing anything locally.
#
#   GitHub -> Actions -> "Build Android APK (OpenDroid + Toni)" -> Run workflow
#
# Then download `toni-debug-apk` from the run's Artifacts.
#
# Why this works: GitHub's `ubuntu-latest` runners already have the Android SDK
# and full internet access, so Gradle can resolve AGP/AndroidX and download the
# Gradle distribution. That is also why OpenDroid's own android-ci.yml has no
# `setup-android` step.
#
# This workflow is self-contained: it clones OpenDroid at build time, copies Toni
# in from this repo, applies the wiring patch, and builds. Nothing needs to be
# committed from OpenDroid, and nothing needs to be on your machine.

on:
  workflow_dispatch:
    inputs:
      opendroid_ref:
        description: "OpenDroid branch, tag or commit to build"
        required: false
        default: "main"
      build_release:
        description: "Also build a signed release (needs the 4 signing secrets)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "android-agent/pet/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout this repository (for Toni)
        uses: actions/checkout@v4

      # Must match jvmToolchain(21) in OpenDroid's app/build.gradle.
      # JDK 17 or 25 will fail the build.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show the toolchain actually in use
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" 2>/dev/null || true

      # ---------------------------------------------------------------
      # 1. OpenDroid -- the base app. Not committed to this repo because it
      #    is upstream's ~31 MB tree; cloning it keeps this repo clean and
      #    means you always build a known ref.
      # ---------------------------------------------------------------
      - name: Clone OpenDroid
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.opendroid_ref || 'main' }}" \
            https://github.com/yashab-cyber/opendroid.git opendroid
          echo "  opendroid at $(git -C opendroid rev-parse --short HEAD)"
          echo "  versionName: $(grep -m1 versionName opendroid/app/build.gradle)"

      # ---------------------------------------------------------------
      # 2. Toni -- copy in and wire up.
      #    apply_patch.py is anchor-verified and idempotent: it checks all
      #    three anchors before writing anything and fails loudly rather
      #    than half-patching if upstream code has drifted.
      # ---------------------------------------------------------------
      - name: Copy Toni sources into the app
        run: |
          set -euo pipefail
          DEST="opendroid/app/src/main/java/com/opendroid/ai/pet"
          mkdir -p "$DEST"
          for f in ToniPetView.kt ToniPetController.kt ToniPetBridge.kt; do
            test -f "android-agent/pet/$f" || { echo "missing android-agent/pet/$f"; exit 1; }
            cp "android-agent/pet/$f" "$DEST/$f"
            echo "  copied $f"
          done

      - name: Verify the wiring anchors
        run: python3 android-agent/pet/apply_patch.py opendroid --check

      - name: Apply the Toni wiring patch
        run: python3 android-agent/pet/apply_patch.py opendroid

      - name: Show the patch for review
        run: |
          git -C opendroid --no-pager diff --stat || true
          git -C opendroid --no-pager diff -- \
            app/src/main/java/com/opendroid/ai/accessibility/OpenDroidAccessibilityService.kt \
            | head -100 || true

      # ---------------------------------------------------------------
      # 3. Build.
      # ---------------------------------------------------------------
      - name: Build debug APK
        working-directory: opendroid
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Report the debug APK
        run: |
          set -euo pipefail
          APK="opendroid/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "gradle succeeded but no APK at $APK"; exit 1; }
          ls -lh "$APK"
          echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: toni-debug-apk
          path: opendroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------------
      # 4. Optional signed release.
      #
      # OpenDroid refuses to sign a release with the debug key, so this needs:
      #   RELEASE_KEYSTORE_BASE64   base64 -w0 < opendroid-release.keystore
      #   RELEASE_STORE_PASSWORD
      #   RELEASE_KEY_ALIAS
      #   RELEASE_KEY_PASSWORD
      #
      # Note: a step's `if` cannot read a variable from its own `env:`, so each
      # of these tests the secret directly.
      # ---------------------------------------------------------------
      - name: Decode the release keystore
        if: ${{ inputs.build_release && secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        working-directory: opendroid
        run: |
          set -euo pipefail
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > opendroid-release.keystore
          ls -l opendroid-release.keystore

      - name: Build signed release APK
        if: ${{ inputs.build_release && secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        working-directory: opendroid
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload signed release APK
        if: ${{ inputs.build_release && secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: toni-release-apk
          path: opendroid/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Warn if a release was requested without secrets
        if: ${{ inputs.build_release && secrets.RELEASE_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::warning::build_release was requested but RELEASE_KEYSTORE_BASE64 is not set."
          echo "Add the four signing secrets, or leave build_release unchecked."
