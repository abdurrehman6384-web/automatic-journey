name: Build APK (OpenDroid + Toni)

# Builds an installable APK on GitHub's runners, so you do not need a local
# JDK, Android SDK or Gradle. `ubuntu-latest` runners ship with the Android SDK
# preinstalled -- that is why there is no android-actions/setup-android step, and
# it is the same reason OpenDroid's own android-ci.yml has none.
#
# Where to put this file:
#     .github/workflows/build-apk.yml   (inside the OpenDroid checkout)
# `pet/install.sh` copies it there for you.
#
# Artifacts land under the run's "Artifacts" section:
#     toni-debug-apk     -> app-debug.apk    (installable, debug-signed)
#     toni-release-apk   -> app-release.apk  (only if the signing secrets exist)
#
# Required repo secrets for a SIGNED release (optional):
#     RELEASE_KEYSTORE_BASE64   base64 of opendroid-release.keystore
#     RELEASE_STORE_PASSWORD
#     RELEASE_KEY_ALIAS
#     RELEASE_KEY_PASSWORD

on:
  workflow_dispatch:            # run it by hand from the Actions tab
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Patch in Toni and build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Must match jvmToolchain(21) in app/build.gradle. OpenDroid's own CI pins
      # this exact combination; JDK 17 or 25 will fail the build.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python (for the Toni patcher)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # -----------------------------------------------------------------
      # Toni: copy the pet in, then wire it up.
      #
      # The patcher is verified to be anchor-based, idempotent and
      # backup-restoring, so this step is safe to re-run and fails loudly
      # rather than half-patching if upstream code drifts.
      # -----------------------------------------------------------------
      - name: Copy Toni sources into the app
        run: |
          set -euo pipefail
          DEST="app/src/main/java/com/opendroid/ai/pet"
          mkdir -p "$DEST"
          for f in ToniPetView.kt ToniPetController.kt ToniPetBridge.kt; do
            test -f "pet/$f" || { echo "missing pet/$f"; exit 1; }
            cp "pet/$f" "$DEST/$f"
            echo "  copied $f"
          done

      - name: Verify the wiring anchors before patching
        run: python3 pet/apply_patch.py . --check

      - name: Apply the Toni wiring patch
        run: python3 pet/apply_patch.py .

      - name: Show the patch (for review in the log)
        run: |
          git --no-pager diff --stat || true
          git --no-pager diff -- \
            app/src/main/java/com/opendroid/ai/accessibility/OpenDroidAccessibilityService.kt \
            | head -80 || true

      # -----------------------------------------------------------------
      # Debug APK -- always built, always installable.
      # -----------------------------------------------------------------
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Report the debug APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "no APK produced"; exit 1; }
          ls -lh "$APK"
          echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: toni-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # -----------------------------------------------------------------
      # Signed release -- only when the secrets are configured.
      #
      # OpenDroid refuses to sign a release with the debug key, so without
      # secrets we deliberately skip rather than emit an unusable artifact.
      # -----------------------------------------------------------------
      - name: Decode the release keystore
        # Same condition as the two steps below. NOTE: this cannot test a
        # variable defined in this step's own `env:` -- a step's `if` is
        # evaluated before its env is populated.
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > opendroid-release.keystore
          ls -l opendroid-release.keystore

      - name: Build signed release APK
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload signed release APK
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: toni-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
